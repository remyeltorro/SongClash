name: Android

on:
  push:
    branches: [master, app]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase Pillow

      - name: Generate icons
        run: python scripts/make_icon.py --android

      # Same steps as build_android.bat
      - name: Build
        run: |
          briefcase create android --no-input
          briefcase build android --no-input
          briefcase package android --no-input -p debug-apk
          cp dist/SongClash-*.apk dist/SongClash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SongClash-apk
          path: dist/SongClash.apk

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/SongClash.apk

  ui-test:
    name: UI test on an emulator
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SongClash-apk
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 35 is Android 15, what the target phone (a Moto G54) runs
      - name: Install the APK and drive the UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            adb install -r dist/SongClash.apk
            python scripts/android_ui_test.py --fresh --out screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SongClash-screenshots
          path: screenshots
