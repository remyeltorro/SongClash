[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "songclash"
description = "Rank an artist's discography through head-to-head song battles."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
# Shared by both front ends. Keep this list free of desktop-only packages:
# Briefcase bundles it into the Android app.
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
desktop = [
    "PyQt6>=6.5",
]
mobile = [
    "toga>=0.5.6",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.0",
    "Pillow>=10.0",
]

[project.gui-scripts]
songclash = "songclash.app:main"

[project.urls]
Homepage = "https://github.com/remyeltorro/SongClash"

[tool.setuptools.dynamic]
version = { attr = "songclash.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
songclash = ["assets/*"]

# ---------- Android app (Briefcase) ----------
# build_android.bat runs `briefcase build android`; see docs/ANDROID.md.

[tool.briefcase]
project_name = "SongClash"
bundle = "io.github.remyeltorro"
url = "https://github.com/remyeltorro/SongClash"
author = "remyeltorro"
# No LICENSE file in the repo yet; Briefcase requires an SPDX expression
license = "LicenseRef-Proprietary"

[tool.briefcase.app.songclash]
formal_name = "SongClash"
description = "Rank an artist's discography through head-to-head song battles."
sources = ["src/songclash"]
# Generated by `python scripts/make_icon.py --android`
icon = "build/icons/songclash"

[tool.briefcase.app.songclash.android]
requires = ["toga-android~=0.5.6"]
# Dark AppCompat (bundled by default), so dialogs and pickers match the dark UI
base_theme = "Theme.AppCompat"
# Leave build_gradle_dependencies unset: Briefcase's defaults include the
# AndroidX libraries Toga's widgets need (DetailedList uses SwipeRefreshLayout).

[tool.briefcase.app.songclash.windows]
requires = ["toga-winforms~=0.5.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E741", # `l` is used for "loser" next to `w`
]

[tool.ruff.lint.per-file-ignores]
"src/songclash/ui/theme.py" = ["E501"] # stylesheet rules read best on one line

[tool.ruff.lint.isort]
known-first-party = ["songclash"]
