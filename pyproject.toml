[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "songclash"
description = "Rank an artist's discography through head-to-head song battles."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "PyQt6>=6.5",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.0",
    "Pillow>=10.0",
]

[project.gui-scripts]
songclash = "songclash.app:main"

[project.urls]
Homepage = "https://github.com/remyeltorro/SongClash"

[tool.setuptools.dynamic]
version = { attr = "songclash.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
songclash = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E741", # `l` is used for "loser" next to `w`
]

[tool.ruff.lint.per-file-ignores]
"src/songclash/ui/theme.py" = ["E501"] # stylesheet rules read best on one line

[tool.ruff.lint.isort]
known-first-party = ["songclash"]
